<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>FuelShare</title>

    <link rel="stylesheet" href="style.css">

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
        defer
    ></script>

    <script src="app.js" defer></script>
</head>

<body>

<div class="container">

    <header class="header">
    <div class="header-brand">
        <h1>🚙 FuelShare</h1>
        <p>Облік витрат на поїздки</p>
    </div>

    <div class="header-actions">

        <div class="theme-switch">
            <input type="checkbox" id="themeToggle">
            <label for="themeToggle"></label>
        </div>

        <a href="admin.html" class="login-button">
            🔐 Увійти
        </a>

    </div>
</header>


    <section class="total-card">

        <span>Загальний борг</span>

        <strong id="totalDebt">
            0.00 €
        </strong>

        <small>
            Усі друзі разом
        </small>

    </section>


    <section class="card">

    <div
        class="section-title"
        id="friendsTitle"
    >
        <h2>👥 Друзі</h2>
    </div>

    <div id="friendsList">
        Завантаження...
    </div>

    </section>


    <section class="card">

        <div class="section-title">
            <h2>📋 Історія</h2>
        </div>

        <div id="tripsList">
            Завантаження...
        </div>

    </section>


    <button
        class="add-button"
        id="openModal"
    >
        ＋ Додати поїздку
    </button>

</div>


<!-- MODAL -->

<div
    class="modal hidden"
    id="modal"
>

    <div class="modal-content">

        <div class="modal-header">

            <h2>Нова поїздка</h2>

            <button
                class="close-button"
                id="closeModal"
            >
                ×
            </button>

        </div>


        <form id="tripForm">

          <label>
                Друг
            
                <select id="friend" required>
                    <option value="">Оберіть друга</option>
                </select>
            </label>


            <label>
                Дата

                <input
                    type="date"
                    id="tripDate"
                    required
                >
            </label>


            <label>
                Сума (€)

                <input
                    type="number"
                    id="amount"
                    min="0.01"
                    step="0.01"
                    placeholder="15.00"
                    required
                >
            </label>


            <label>
                Коментар

                <input
                    type="text"
                    id="comment"
                    placeholder="Наприклад, Kuopio → Joensuu"
                >
            </label>


            <button
                type="submit"
                class="submit-button"
            >
                Додати
            </button>

        </form>

    </div>

</div>

</body>
</html>
