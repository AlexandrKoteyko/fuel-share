<!DOCTYPE html>
<html lang="uk">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>FuelShare — Admin</title>

    <link rel="stylesheet" href="style.css">

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
        defer
    ></script>

    <script
        src="admin.js"
        defer
    ></script>

</head>


<body>

<div class="container">

    <!-- LOGIN -->

    <section
        class="card"
        id="loginSection"
    >

        <h1>🔐 FuelShare</h1>

        <p>Вхід адміністратора</p>


        <form id="loginForm">

            <label>

                Email

                <input
                    type="email"
                    id="email"
                    required
                    autocomplete="email"
                >

            </label>


            <label>

                Пароль

                <input
                    type="password"
                    id="password"
                    required
                    autocomplete="current-password"
                >

            </label>


            <button
                type="submit"
                class="submit-button"
            >
                Увійти
            </button>

        </form>


        <p id="loginError"></p>

    </section>


    <!-- ADMIN -->

    <div
        id="adminSection"
        class="hidden"
    >

        <header class="header">

            <h1>🚗 FuelShare</h1>

            <p>
                Панель адміністратора
            </p>

        </header>


        <section class="total-card">

            <span>
                Загальний борг
            </span>

            <strong id="totalDebt">
                0.00 €
            </strong>

            <small>
                Усі друзі разом
            </small>

        </section>


        <!-- ADD -->

        <section class="card">

            <h2>
                ➕ Додати поїздку
            </h2>


            <form id="tripForm">

                <label>

                    Друг

                    <select
                        id="friend"
                        required
                    >

                        <option value="">
                            Оберіть друга
                        </option>

                    </select>

                </label>


                <label>

                    Дата

                    <input
                        type="date"
                        id="tripDate"
                        required
                    >

                </label>


                <label>

                    Сума (€)

                    <input
                           type="number"
                            id="amount"
                            step="0.01"
                            placeholder="15.00 или -15.00"
                            required
                    >

                </label>


                <label>

                    Коментар

                    <input
                        type="text"
                        id="comment"
                        placeholder="Наприклад, Kuopio → Joensuu"
                    >

                </label>


                <button
                    type="submit"
                    class="submit-button"
                >
                    Додати
                </button>

            </form>

        </section>


        <!-- FRIENDS -->

        <section class="card">

            <h2>
                👥 Друзі
            </h2>

            <div id="friendsList">
                Завантаження...
            </div>

        </section>


        <!-- TRIPS -->

        <section class="card">

            <h2>
                📋 Поїздки
            </h2>

            <div id="tripsList">
                Завантаження...
            </div>

        </section>


        <button
            id="logoutButton"
            class="add-button"
        >
            Вийти
        </button>

    </div>

</div>

</body>

</html>
